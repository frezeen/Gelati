<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelati alla Frutta - Ninja Creami Deluxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            animation: backgroundShift 10s ease-in-out infinite alternate;
        }
        
        @keyframes backgroundShift {
            0% { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
            100% { background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%); }
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: rgba(255,255,255,0.95); 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        
        .header { 
            background: linear-gradient(135deg, #f093fb, #f5576c); 
            color: white; 
            padding: 40px; 
            text-align: center; 
        }
        
        .header h1 { 
            margin: 0; 
            font-size: 3em; 
            font-weight: 700;
        }
        
        .nav-button {
            display: inline-block;
            padding: 12px 25px;
            margin: 10px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .nav-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }
        
        .content {
            padding: 40px;
            text-align: center;
        }
        
        .coming-soon {
            font-size: 1.5em;
            color: #666;
            margin: 40px 0;
        }
        
        .emoji {
            font-size: 4em;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍓 Gelati alla Frutta</h1>
            <p>Frutta fresca con base cremosa - Ninja Creami Deluxe</p>
            <a href="../../../index.html" class="nav-button">🏠 Torna al Catalogo</a>
        </div>
        
        <div class="content">
            <div class="emoji">🚧</div>
            <div class="coming-soon">
                <strong>Sezione in Costruzione</strong><br>
                Le ricette di gelati alla frutta saranno disponibili presto!
            </div>
            <p>Prepareremo ricette per: fragola, pesca, frutti di bosco, agrumi e frutta esotica.</p>
        </div>
    </div>
</body>
</html>
